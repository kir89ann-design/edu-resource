<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t2f2">
  <title id="t2f2">Карта распределения среднегодовой инсоляции</title>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1f2937">Среднегодовая инсоляция, кВт·ч/м²</text>
  <!-- Условная карта -->
  <rect x="80" y="80" width="640" height="300" rx="10" fill="#e6f0fa" stroke="#4a5568" stroke-width="2"/>
  <!-- Зоны -->
  <rect x="100" y="100" width="180" height="260" fill="#f6e05e"/>
  <rect x="280" y="100" width="220" height="260" fill="#f6ad55"/>
  <rect x="500" y="100" width="200" height="260" fill="#dd6b20"/>
  <!-- Легенда -->
  <text x="190" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">1200–1400</text>
  <text x="390" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">1400–1600</text>
  <text x="600" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">1600+</text>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a5568">Южные регионы получают больше солнечной энергии</text>
</svg>