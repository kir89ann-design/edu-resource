<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t2f1">
  <title id="t2f1">Спектр солнечного излучения на границе атмосферы и на уровне моря</title>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1f2937">Спектр солнечного излучения</text>
  <!-- Оси -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#4a5568" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="80" stroke="#4a5568" stroke-width="2"/>
  <text x="410" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a5568">Длина волны, нм</text>
  <text x="40" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a5568" transform="rotate(-90 40 220)">Интенсивность</text>
  <!-- Кривая на границе атмосферы -->
  <path d="M80,300 C180,120 300,110 400,150 C500,190 620,220 740,280" fill="none" stroke="#dd6b20" stroke-width="3"/>
  <!-- Кривая на уровне моря -->
  <path d="M80,320 C180,200 300,190 400,220 C500,250 620,270 740,300" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <!-- Подписи -->
  <rect x="500" y="90" width="18" height="10" fill="#dd6b20"/>
  <text x="525" y="100" font-family="sans-serif" font-size="14" fill="#1f2937">На границе атмосферы (AM0)</text>
  <rect x="500" y="115" width="18" height="10" fill="#2b6cb0"/>
  <text x="525" y="125" font-family="sans-serif" font-size="14" fill="#1f2937">На уровне моря (AM1.5)</text>
</svg>