<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t4f1">
  <title id="t4f1">Схема гидроэлектростанции: плотина, турбина, генератор</title>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1f2937">Схема гидроэлектростанции</text>
  <!-- Вода -->
  <rect x="60" y="180" width="300" height="180" fill="#bee3f8"/>
  <rect x="400" y="260" width="340" height="100" fill="#bee3f8"/>
  <!-- Плотина -->
  <rect x="360" y="150" width="40" height="210" fill="#718096"/>
  <!-- Турбина -->
  <circle cx="450" cy="310" r="22" fill="#2b6cb0"/>
  <path d="M450,288 L450,332 M428,310 L472,310 M434,294 L466,326 M466,294 L434,326" stroke="#fff" stroke-width="3"/>
  <!-- Генератор -->
  <rect x="490" y="285" width="60" height="50" rx="6" fill="#dd6b20"/>
  <text x="520" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Ген</text>
  <!-- Линия электропередачи -->
  <line x1="550" y1="310" x2="680" y2="310" stroke="#4a5568" stroke-width="3"/>
  <text x="640" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a5568">ЛЭП</text>
  <!-- Подписи -->
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b6cb0">Верхний бьеф</text>
  <text x="580" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#2b6cb0">Нижний бьеф</text>
  <text x="380" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">Плотина</text>
</svg>