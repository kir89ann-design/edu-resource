<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t8f1">
  <title id="t8f1">Схема образования и использования вторичных энергетических ресурсов</title>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1f2937">Образование и использование ВЭР</text>
  <rect x="60" y="120" width="200" height="120" rx="12" fill="#2b6cb0"/>
  <text x="160" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">Технологический</text>
  <text x="160" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">процесс</text>
  <rect x="300" y="120" width="200" height="120" rx="12" fill="#dd6b20"/>
  <text x="400" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">ВЭР</text>
  <text x="400" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">(тепло, газы, давление)</text>
  <rect x="540" y="120" width="200" height="120" rx="12" fill="#38a169"/>
  <text x="640" y="170" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">Полезное</text>
  <text x="640" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">использование</text>
  <line x1="260" y1="180" x2="300" y2="180" stroke="#4a5568" stroke-width="3"/>
  <line x1="500" y1="180" x2="540" y2="180" stroke="#4a5568" stroke-width="3"/>
  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a5568">Снижение потребления первичного топлива на 10–20 %</text>
</svg>