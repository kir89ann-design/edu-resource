<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t3f2">
  <title id="t3f2">Зависимость коэффициента мощности ветроколеса от скорости ветра</title>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1f2937">Коэффициент мощности ветроколеса</text>
  <line x1="100" y1="360" x2="720" y2="360" stroke="#4a5568" stroke-width="2"/>
  <line x1="100" y1="360" x2="100" y2="80" stroke="#4a5568" stroke-width="2"/>
  <text x="410" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a5568">Скорость ветра, м/с</text>
  <text x="50" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a5568" transform="rotate(-90 50 220)">Cp</text>
  <!-- Предел Беца -->
  <line x1="100" y1="130" x2="720" y2="130" stroke="#dd6b20" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="720" y="120" text-anchor="end" font-family="sans-serif" font-size="14" fill="#dd6b20">Предел Беца 0,593</text>
  <!-- Кривая Cp -->
  <path d="M100,360 C200,300 260,180 340,160 C420,140 500,150 600,180 C680,200 720,230 720,240" fill="none" stroke="#2b6cb0" stroke-width="3"/>
</svg>