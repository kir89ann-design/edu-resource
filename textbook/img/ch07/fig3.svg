<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t7f3">
  <title id="t7f3">Схема технологий переработки биомассы</title>
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1f2937">Технологии переработки биомассы</text>
  <rect x="60" y="100" width="320" height="120" rx="12" fill="#dd6b20"/>
  <text x="220" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" font-weight="bold">Термохимические</text>
  <text x="220" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">Сжигание, газификация, пиролиз</text>

  <rect x="420" y="100" width="320" height="120" rx="12" fill="#38a169"/>
  <text x="580" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" font-weight="bold">Биохимические</text>
  <text x="580" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Сбраживание, брожение</text>

  <rect x="60" y="250" width="320" height="120" rx="12" fill="#2b6cb0"/>
  <text x="220" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" font-weight="bold">Механические</text>
  <text x="220" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Прессование, гранулирование</text>

  <rect x="420" y="250" width="320" height="120" rx="12" fill="#805ad5"/>
  <text x="580" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" font-weight="bold">Химические</text>
  <text x="580" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Переэтерификация</text>
</svg>